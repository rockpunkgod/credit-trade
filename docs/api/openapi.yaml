openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Credit Trade Local Sandbox API
  version: 0.0.1-sandbox
  description: |
    Implemented loopback-only API for the synthetic Credit Trade vertical slice.
    It uses mock inference endpoints and an in-memory ledger. It has no real
    provider, payment rail, production credential, or production-payment unlock.

    Missing or unreviewed vendor and market evidence remains PENDING_REVIEW.
    PROHIBITED is reserved for a prohibition explicit in a current official
    source; neither status enables production operation.

    Internal synthetic supplier and buyer/API-key-hash records, platform
    fee/quote-lifetime policy, provider endpoint, versioned supply price, quote,
    usage, rating, currency-ledger checkpoint and settlement bindings use
    process-local HMAC integrity seals. Price versions also have local stream
    heads. Idempotency requests use an opaque HMAC authentication code and replays
    are reconstructed from canonical authenticated records. These controls are
    neither encryption, configuration approval, real KYB, provider evidence nor
    public digital signatures, and no seal, code, checkpoint, key identifier or
    key material is added to the HTTP response fields defined here.
servers:
  - url: http://127.0.0.1:3000
    description: Default local process
tags:
  - name: Status
  - name: Sandbox setup
  - name: Inference
  - name: Sandbox inspection
paths:
  /health:
    get:
      tags: [Status]
      operationId: getHealth
      summary: Read the local sandbox and production-payment lock state
      responses:
        '200':
          description: Sandbox process is ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Sandbox-Mode:
              $ref: '#/components/headers/SandboxMode'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /sandbox/suppliers:
    post:
      tags: [Sandbox setup]
      operationId: createSandboxSupplier
      summary: Create a synthetic supplier
      description: Creates an in-memory sandbox record whose exact fixture fields are internally HMAC sealed; this does not perform or prove real KYB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplier'
      responses:
        '201':
          description: Synthetic supplier created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
  /sandbox/suppliers/{supplierId}/endpoints:
    post:
      tags: [Sandbox setup]
      operationId: registerSandboxEndpointAndPrice
      summary: Register a supplier endpoint and its model price
      description: |
        Registers an endpoint and publishes one exact string-denominated sandbox
        model price. Their complete internal records are separately HMAC sealed,
        later price versions are predecessor-linked, and a local price-stream head
        detects newest-version deletion while the head remains intact. These seals
        and the head are not returned.
        Only built-in mock schemes can complete inference. Registering, identifying
        or sealing an endpoint is not vendor authorization or market admission.
      parameters:
        - $ref: '#/components/parameters/SupplierId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEndpoint'
      responses:
        '201':
          description: Endpoint and immutable sandbox price created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointPriceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
  /sandbox/buyers:
    post:
      tags: [Sandbox setup]
      operationId: createSandboxBuyer
      summary: Create a synthetic buyer and an API key disclosed only once
      description: |
        The initial balance is an in-memory accounting fixture, not money, stored
        value, a transferable wallet, or payment-provider sandbox funding. The raw
        API key appears only in this response. The internal buyer record seals the
        stored API-key hash, and its buyer/hash index is verified bidirectionally;
        neither the hash nor its seal is returned, and this is not identity proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuyer'
      responses:
        '201':
          description: Synthetic buyer created; the raw API key is disclosed in this response only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/quotes:
    post:
      tags: [Inference]
      operationId: createQuote
      summary: Create a buyer-bound versioned quote with a maximum hold amount
      description: |
        Calculates the maximum hold amount but does not post a hold journal until
        inference starts. Endpoint and supply-price seals are verified first; the
        complete internal quote/rating-policy binding names the selected price seal
        as its parent. No integrity seal is returned by this API.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuote'
      responses:
        '201':
          description: Quote created with a calculated maximum hold amount; no funds are moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/inference:
    post:
      tags: [Inference]
      operationId: runInference
      summary: Execute one quote-bound synthetic inference
      description: |
        The sandbox never sends the prompt to a real provider. Internal usage,
        rating, delivered-output digest, complete linked-ledger content, currency
        checkpoint and settlement-chain bindings are authenticated and verified
        before the result is accepted. An internal HMAC request code protects
        idempotency replay, which is matched to canonical billing/inference records
        instead of an unauthenticated cached response. This does not make estimated
        usage provider-authoritative, and no buyer-verifiable proof is returned.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunInference'
      responses:
        '200':
          description: Synthetic inference metered and settled exactly once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /sandbox/state:
    get:
      tags: [Sandbox inspection]
      operationId: getSandboxState
      summary: Read a redacted in-memory domain snapshot
      description: API keys, hashes, credentials, authorization fields, secrets, prompts, integrity seals, authentication tags, integrity key identifiers and key material are removed.
      responses:
        '200':
          description: Redacted sandbox state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /sandbox/ledger:
    get:
      tags: [Sandbox inspection]
      operationId: getSandboxLedger
      summary: Read the redacted balanced sandbox ledger
      description: The endpoint/price catalog, canonical billing records, complete currency-level journal checkpoints and balances replayed from all postings are verified before the ledger is returned; integrity seals, checkpoints and key information are not included in the response.
      responses:
        '200':
          description: Ledger snapshot; balanced is true only when every journal balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: CreditTradeSandboxApiKey
      description: Sandbox buyer API key disclosed only at creation. Never send a production credential.
  parameters:
    SupplierId:
      name: supplierId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Reusing a key with different input is rejected.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
  headers:
    RequestId:
      description: Request correlation identifier.
      schema:
        type: string
        format: uuid
    SandboxMode:
      description: Always true for this server.
      schema:
        type: string
        const: 'true'
  responses:
    BadRequest:
      description: Invalid target, query, JSON, field, content length, or idempotency key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Bearer key is missing, malformed, or invalid.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The selected endpoint does not belong to the requested supplier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Route or requested sandbox record was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Quote, balance, or idempotency state conflicts with the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BodyTooLarge:
      description: JSON request body exceeds 65536 bytes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnsupportedMedia:
      description: Body is not uncompressed application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: No eligible sandbox route, the endpoint is not routable, or input usage exceeds the immutable quote limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Redacted unexpected failure, including an internal integrity-verification failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    DecimalInteger:
      type: string
      description: Non-negative base-10 integer; JSON numbers are rejected.
      pattern: '^(0|[1-9][0-9]{0,29})$'
    TokenCount:
      type: string
      description: Non-negative token limit no greater than the sandbox cap of 10000000.
      pattern: '^(0|[1-9][0-9]{0,6}|10000000)$'
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
    Health:
      type: object
      additionalProperties: false
      required: [sandbox, status, productionPaymentsEnabled, bindPolicy]
      properties:
        sandbox:
          type: boolean
          const: true
        status:
          type: string
          const: ok
        productionPaymentsEnabled:
          type: boolean
          const: false
        bindPolicy:
          type: string
          const: loopback-only
    CreateSupplier:
      type: object
      additionalProperties: true
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
    RegisterEndpoint:
      type: object
      additionalProperties: true
      required:
        - url
        - model
        - currency
        - inputTokenPriceMinor
        - outputTokenPriceMinor
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          examples: [mock://acme-ai]
        declaredVendor:
          type: string
          minLength: 1
          maxLength: 128
        model:
          type: string
          minLength: 1
          maxLength: 256
        currency:
          $ref: '#/components/schemas/Currency'
        inputTokenPriceMinor:
          $ref: '#/components/schemas/DecimalInteger'
          description: Synthetic minor-currency units charged by the supplier per input token.
        outputTokenPriceMinor:
          $ref: '#/components/schemas/DecimalInteger'
          description: Synthetic minor-currency units charged by the supplier per output token.
    CreateBuyer:
      type: object
      additionalProperties: true
      required: [name, currency, initialBalanceMinor]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        currency:
          $ref: '#/components/schemas/Currency'
        initialBalanceMinor:
          $ref: '#/components/schemas/DecimalInteger'
    CreateQuote:
      type: object
      additionalProperties: true
      required: [supplierId, endpointId, model, maxInputTokens, maxOutputTokens]
      properties:
        supplierId:
          $ref: '#/components/schemas/Identifier'
        endpointId:
          $ref: '#/components/schemas/Identifier'
        model:
          type: string
          minLength: 1
          maxLength: 256
        maxInputTokens:
          $ref: '#/components/schemas/TokenCount'
        maxOutputTokens:
          $ref: '#/components/schemas/TokenCount'
    RunInference:
      type: object
      additionalProperties: true
      required: [quoteId, prompt]
      properties:
        quoteId:
          $ref: '#/components/schemas/Identifier'
        prompt:
          type: string
          minLength: 1
          maxLength: 32768
    Supplier:
      type: object
      description: Synthetic supplier fixture. Its exact internal ID, name, SANDBOX_FIXTURE status and creation time are HMAC sealed, but the seal is absent from this HTTP shape and is not real KYB evidence.
      additionalProperties: false
      required: [supplierId, name, kybStatus, createdAt]
      properties:
        supplierId:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
        kybStatus:
          type: string
          const: SANDBOX_FIXTURE
          description: Synthetic fixture state; it is not real KYB approval.
        createdAt:
          type: string
          format: date-time
    Endpoint:
      type: object
      description: Supplier endpoint snapshot. The exact internal snapshot is HMAC sealed and verified before use, but the seal is absent from this HTTP shape and does not prove provider control or authorization.
      additionalProperties: false
      required:
        - endpointId
        - supplierId
        - url
        - detectionStatus
        - evidenceStatus
        - sandboxRoutable
        - createdAt
      properties:
        endpointId:
          $ref: '#/components/schemas/Identifier'
        supplierId:
          $ref: '#/components/schemas/Identifier'
        url:
          type: string
        declaredVendor:
          type: string
          description: Normalized supplier claim; omitted when none was supplied.
        detectedVendor:
          type: string
          description: Technical sandbox classification such as ACME_AI; not legal authorization.
        detectionStatus:
          type: string
          enum: [VERIFIED_SANDBOX, UNIDENTIFIED, CONFLICT]
        evidenceStatus:
          type: string
          enum: [PENDING_REVIEW, PROHIBITED]
        sandboxRoutable:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Price:
      type: object
      description: Versioned synthetic supply price. Internal versions are HMAC sealed and predecessor-linked per supplier, endpoint, model and currency; a separate process-local stream head detects deletion of the newest version while that head remains intact. Seals and heads are absent from this HTTP shape and are not externally anchored.
      additionalProperties: false
      required:
        - priceId
        - supplierId
        - endpointId
        - model
        - currency
        - inputTokenPriceMinor
        - outputTokenPriceMinor
        - version
        - effectiveAt
      properties:
        priceId:
          $ref: '#/components/schemas/Identifier'
        supplierId:
          $ref: '#/components/schemas/Identifier'
        endpointId:
          $ref: '#/components/schemas/Identifier'
        model:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        inputTokenPriceMinor:
          $ref: '#/components/schemas/DecimalInteger'
          description: Immutable synthetic minor-currency units per input token.
        outputTokenPriceMinor:
          $ref: '#/components/schemas/DecimalInteger'
          description: Immutable synthetic minor-currency units per output token.
        version:
          $ref: '#/components/schemas/DecimalInteger'
        effectiveAt:
          type: string
          format: date-time
    Buyer:
      type: object
      description: Synthetic buyer snapshot. The internal record HMAC seals its metadata and stored API-key hash and verifies the buyer/hash index in both directions; neither hash nor seal appears here, and the seal does not prove raw-key possession or identity.
      additionalProperties: false
      required:
        - buyerId
        - name
        - currency
        - availableBalanceMinor
        - reservedBalanceMinor
        - createdAt
      properties:
        buyerId:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        availableBalanceMinor:
          $ref: '#/components/schemas/DecimalInteger'
        reservedBalanceMinor:
          $ref: '#/components/schemas/DecimalInteger'
        createdAt:
          type: string
          format: date-time
    BuyerWithKey:
      type: object
      required: [buyer, apiKey]
      properties:
        buyer:
          $ref: '#/components/schemas/Buyer'
        apiKey:
          type: string
          minLength: 8
          readOnly: true
          description: Returned only at buyer creation; snapshots remove it and its hash.
      additionalProperties: false
    Quote:
      type: object
      description: Buyer quote with immutable pricing and limit terms. Creation calculates the maximum hold but does not move funds; before creation the sandbox verifies a startup seal over the billing-policy version, platform fee and quote lifetime, then pins the selected supply-price seal and authenticates the meter/rating-policy binding used at inference time. The platform-policy seal detects unsealed in-process configuration edits but is not production configuration approval. Exact Map and record coverage requires the quote key/ID and USED status to correspond to one settled inference. Internal seals are deliberately absent from this public shape.
      additionalProperties: false
      required:
        - quoteId
        - buyerId
        - supplierId
        - endpointId
        - detectedVendor
        - model
        - currency
        - maxInputTokens
        - maxOutputTokens
        - inputTokenPriceMinor
        - outputTokenPriceMinor
        - supplierMaxCostMinor
        - platformFeeBps
        - platformMaxFeeMinor
        - maxHoldMinor
        - priceId
        - priceVersion
        - createdAt
        - expiresAt
        - status
      properties:
        quoteId:
          $ref: '#/components/schemas/Identifier'
        buyerId:
          $ref: '#/components/schemas/Identifier'
        supplierId:
          $ref: '#/components/schemas/Identifier'
        endpointId:
          $ref: '#/components/schemas/Identifier'
        detectedVendor:
          type: string
        model:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        maxInputTokens:
          $ref: '#/components/schemas/TokenCount'
        maxOutputTokens:
          $ref: '#/components/schemas/TokenCount'
        inputTokenPriceMinor:
          $ref: '#/components/schemas/DecimalInteger'
        outputTokenPriceMinor:
          $ref: '#/components/schemas/DecimalInteger'
        supplierMaxCostMinor:
          $ref: '#/components/schemas/DecimalInteger'
        platformFeeBps:
          $ref: '#/components/schemas/DecimalInteger'
        platformMaxFeeMinor:
          $ref: '#/components/schemas/DecimalInteger'
        maxHoldMinor:
          $ref: '#/components/schemas/DecimalInteger'
        priceId:
          $ref: '#/components/schemas/Identifier'
        priceVersion:
          $ref: '#/components/schemas/DecimalInteger'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ISSUED, USED]
    Usage:
      type: object
      description: Deterministic sandbox-estimated input and actually delivered output tokens. The corresponding internal record is integrity-sealed, but that authenticates platform content rather than proving measurement truth. This is not authoritative provider usage or invoice evidence; totalTokens remains inputTokens plus outputTokens.
      additionalProperties: false
      required: [inputTokens, outputTokens, totalTokens]
      properties:
        inputTokens:
          $ref: '#/components/schemas/DecimalInteger'
        outputTokens:
          $ref: '#/components/schemas/DecimalInteger'
        totalTokens:
          $ref: '#/components/schemas/DecimalInteger'
    Inference:
      type: object
      description: Synchronously metered, rated and ledger-settled synthetic inference result. Canonical verification reconstructs these fields from the authenticated quote, usage, rating, delivered-output digest, journal links and settlement, while idempotent replay validates an opaque internal HMAC request code. The existing flat fields remain the public contract; internal records, codes, checkpoints and seals are not buyer-submittable or HTTP-visible. These controls are not encryption, a public signature or provider attestation.
      additionalProperties: false
      required:
        - sandbox
        - inferenceId
        - quoteId
        - supplierId
        - endpointId
        - vendor
        - model
        - output
        - usage
        - currency
        - supplierCostMinor
        - platformFeeMinor
        - buyerChargeMinor
        - ledgerJournalIds
        - createdAt
      properties:
        sandbox:
          type: boolean
          const: true
        inferenceId:
          $ref: '#/components/schemas/Identifier'
        quoteId:
          $ref: '#/components/schemas/Identifier'
        supplierId:
          $ref: '#/components/schemas/Identifier'
        endpointId:
          $ref: '#/components/schemas/Identifier'
        vendor:
          type: string
        model:
          type: string
        output:
          type: string
          description: Synthetic output truncated to the immutable quoted output-token limit before metering; state and ledger inspection routes redact prompt-like fields.
        usage:
          $ref: '#/components/schemas/Usage'
        currency:
          $ref: '#/components/schemas/Currency'
        supplierCostMinor:
          $ref: '#/components/schemas/DecimalInteger'
        platformFeeMinor:
          $ref: '#/components/schemas/DecimalInteger'
        buyerChargeMinor:
          $ref: '#/components/schemas/DecimalInteger'
        ledgerJournalIds:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        createdAt:
          type: string
          format: date-time
    LedgerPosting:
      type: object
      additionalProperties: false
      required: [account, direction, amountMinor]
      properties:
        account:
          type: string
        direction:
          type: string
          enum: [DEBIT, CREDIT]
        amountMinor:
          $ref: '#/components/schemas/DecimalInteger'
    LedgerJournal:
      type: object
      additionalProperties: false
      required: [journalId, eventType, currency, businessKey, postings, createdAt]
      properties:
        journalId:
          $ref: '#/components/schemas/Identifier'
        eventType:
          type: string
          enum: [SANDBOX_FUNDING, HOLD_PLACED, INFERENCE_SETTLED, HOLD_RELEASED]
        currency:
          $ref: '#/components/schemas/Currency'
        businessKey:
          type: string
        postings:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/LedgerPosting'
        createdAt:
          type: string
          format: date-time
    Ledger:
      type: object
      description: Public journal view returned only after all journals have been replayed into balances and the internal per-currency HMAC checkpoint histories have verified. Checkpoints and materialized balances are not added to this response shape.
      additionalProperties: false
      required: [balanced, journals]
      properties:
        balanced:
          type: boolean
        journals:
          type: array
          items:
            $ref: '#/components/schemas/LedgerJournal'
    StateInference:
      type: object
      additionalProperties: false
      required:
        - inferenceId
        - quoteId
        - supplierId
        - endpointId
        - vendor
        - model
        - usage
        - currency
        - buyerChargeMinor
        - createdAt
      properties:
        inferenceId:
          $ref: '#/components/schemas/Identifier'
        quoteId:
          $ref: '#/components/schemas/Identifier'
        supplierId:
          $ref: '#/components/schemas/Identifier'
        endpointId:
          $ref: '#/components/schemas/Identifier'
        vendor:
          type: string
        model:
          type: string
        usage:
          $ref: '#/components/schemas/Usage'
        currency:
          $ref: '#/components/schemas/Currency'
        buyerChargeMinor:
          $ref: '#/components/schemas/DecimalInteger'
        createdAt:
